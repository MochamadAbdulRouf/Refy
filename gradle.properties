# Konfigurasi Gradle Refy.
#
# MESIN INI RAM-nya KECIL: 7,4 GB total, hanya ~1,1 GB bebas saat build pertama
# (brave + Orca jalan). Build pertama dengan -Xmx4g + parallel MEMBUNUH daemon:
#   "Native memory allocation (mmap) failed to map 214958080 bytes ... G1 virtual space"
#   → hs_err_pid13380.log, 2026-11-16.
# Jadi angka di bawah sengaja konservatif. Naikkan HANYA kalau RAM bebas > 3 GB.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.vfs.watch=false

# Kotlin dijalankan di proses Gradle yang sama — daemon Kotlin terpisah = satu JVM lagi.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Configuration cache & KSP/Hilt belum diuji bersama di repo ini — dinyalakan
# hanya setelah `assembleDebug` hijau dengan cache itu. Jangan nyalakan membabi buta.
